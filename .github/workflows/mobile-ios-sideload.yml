name: iOS unsigned sideload build

on:
  push:
    branches:
      - cursor/integrate-remote-branches-7334
    paths:
      - .github/workflows/mobile-ios-sideload.yml
      - apps/mobile/**
  workflow_dispatch:
    inputs:
      api_url:
        description: HTTPS address reachable from the iPhone
        required: true
        default: https://124.221.182.39
      bundle_id:
        description: Stable bundle identifier; use a separate identifier for staging servers
        required: true
        default: xin.zxlup.sydney
      companion_experiment:
        description: Embed iOS Live Activity companion extension (Dynamic Island)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      CI: "1"
      SYDNEY_SIDELOAD_IOS: "1"
      EXPO_PUBLIC_SYDNEY_SIDELOAD: "1"
      SYDNEY_COMPANION_EXPERIMENT: ${{ github.event_name == 'workflow_dispatch' && !inputs.companion_experiment && '0' || '1' }}
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || 'https://124.221.182.39' }}
      SYDNEY_IOS_BUNDLE_ID: ${{ inputs.bundle_id || 'xin.zxlup.sydney' }}
      SYDNEY_OTA_PROJECT_ID: ${{ (inputs.api_url || 'https://124.221.182.39') == 'https://124.221.182.39' && (inputs.bundle_id || 'xin.zxlup.sydney') == 'xin.zxlup.sydney' && vars.SYDNEY_OTA_PROJECT_ID || '' }}
      SYDNEY_OTA_OWNER: ${{ (inputs.api_url || 'https://124.221.182.39') == 'https://124.221.182.39' && (inputs.bundle_id || 'xin.zxlup.sydney') == 'xin.zxlup.sydney' && vars.SYDNEY_OTA_OWNER || '' }}
      SYDNEY_OTA_RUNTIME_VERSION: ${{ (inputs.api_url || 'https://124.221.182.39') == 'https://124.221.182.39' && (inputs.bundle_id || 'xin.zxlup.sydney') == 'xin.zxlup.sydney' && vars.SYDNEY_OTA_RUNTIME_VERSION || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Guard sideload update target
        run: |
          set -euo pipefail
          if [[ -n "$SYDNEY_OTA_PROJECT_ID$SYDNEY_OTA_OWNER$SYDNEY_OTA_RUNTIME_VERSION" &&
                ( "$EXPO_PUBLIC_API_URL" != "https://124.221.182.39" ||
                  "$SYDNEY_IOS_BUNDLE_ID" != "xin.zxlup.sydney" ) ]]; then
            echo "OTA-enabled sideload builds require the production IP target and xin.zxlup.sydney bundle ID." >&2
            exit 1
          fi

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Check Xcode and device SDK
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          /usr/bin/python3 -c 'import sys; assert tuple(map(int, sys.argv[1].split("."))) >= (27, 1), "iOS SDK 27.1 or newer is required"' "$sdk_version"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate iOS project
        run: pnpm --filter @rakazo/mobile exec expo prebuild --platform ios --no-install

      - name: Remove remote push entitlement from sideload app
        run: |
          /usr/bin/python3 -c '
          import pathlib, plistlib
          path = pathlib.Path("apps/mobile/ios/Sydney/Sydney.entitlements")
          with path.open("rb") as stream:
              entitlements = plistlib.load(stream)
          entitlements.pop("aps-environment", None)
          with path.open("wb") as stream:
              plistlib.dump(entitlements, stream)
          '

      - name: Install iOS native dependencies
        working-directory: apps/mobile/ios
        run: pod install

      - name: Check generated entitlements
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          /usr/bin/python3 -c '
          import pathlib, plistlib
          forbidden = {"aps-environment", "com.apple.developer.associated-domains", "com.apple.developer.siri"}
          for path in pathlib.Path(".").rglob("*.entitlements"):
              if "Pods" in path.parts:
                  continue
              with path.open("rb") as stream:
                  found = forbidden.intersection(plistlib.load(stream))
              if found:
                  raise SystemExit(f"Unsupported entitlements in {path}: {sorted(found)}")
          '

      - name: Build unsigned iPhone app
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          xcodebuild -list -workspace Sydney.xcworkspace
          xcodebuild -workspace Sydney.xcworkspace -scheme Sydney -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/sydney-ios-build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Verify and package unsigned app
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/sydney-ios-build/Build/Products/Release-iphoneos/Sydney.app"
          test -d "$app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")
          xcrun lipo -verify_arch arm64 "$app/$executable"
          test -f "$app/main.jsbundle"
          location_prompt=$(/usr/libexec/PlistBuddy -c 'Print :NSLocationWhenInUseUsageDescription' "$app/Info.plist")
          test -n "$location_prompt"
          for key in NSCalendarsUsageDescription NSCalendarsFullAccessUsageDescription NSRemindersUsageDescription NSRemindersFullAccessUsageDescription NSContactsUsageDescription; do
            val=$(/usr/libexec/PlistBuddy -c "Print :$key" "$app/Info.plist")
            test -n "$val"
          done
          if [[ "$SYDNEY_COMPANION_EXPERIMENT" == "1" ]]; then
            extension="$app/PlugIns/SydneyCompanionWidget.appex"
            test -d "$extension"
            test "$(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$app/Info.plist")" = "true"
            test "$(/usr/libexec/PlistBuddy -c 'Print :SydneyCompanionEnabled' "$app/Info.plist")" = "true"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$extension/Info.plist")" = "$SYDNEY_IOS_BUNDLE_ID.companion"
            test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$extension/Info.plist")" = "com.apple.widgetkit-extension"
            extension_executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$extension/Info.plist")
            xcrun lipo -verify_arch arm64 "$extension/$extension_executable"
          else
            test ! -d "$app/PlugIns"
          fi
          mkdir -p "$RUNNER_TEMP/sydney-ipa/Payload" "$GITHUB_WORKSPACE/ios-artifact"
          ditto "$app" "$RUNNER_TEMP/sydney-ipa/Payload/Sydney.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/sydney-ipa/Payload" "$GITHUB_WORKSPACE/ios-artifact/Sydney-unsigned.ipa"
          /usr/bin/python3 -c '
          import os, pathlib, plistlib, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = archive.namelist()
              longest = max(names, key=len)
              bundle = archive.read("Payload/Sydney.app/main.jsbundle")
              expo_plist = plistlib.loads(archive.read("Payload/Sydney.app/Expo.plist"))
          if len(longest) > 200:
              raise SystemExit(f"IPA path exceeds Windows sideload budget ({len(longest)} > 200): {longest}")
          asset_dirs = {
              entry.split("/")[4]
              for entry in names
              if entry.startswith("Payload/Sydney.app/assets/sydney/") and len(entry.split("/")) > 5
          }
          if not asset_dirs:
              raise SystemExit("Expected bundled assets under Payload/Sydney.app/assets/sydney/")
          missing = sorted(d for d in asset_dirs if f"/assets/sydney/{d}".encode() not in bundle)
          if missing:
              raise SystemExit(f"Bundled asset directories missing from main.jsbundle: {missing}")
          ota_project = os.environ.get("SYDNEY_OTA_PROJECT_ID", "")
          ota_runtime = os.environ.get("SYDNEY_OTA_RUNTIME_VERSION", "")
          enabled = expo_plist.get("EXUpdatesEnabled")
          actual_url = expo_plist.get("EXUpdatesURL")
          actual_runtime = expo_plist.get("EXUpdatesRuntimeVersion")
          if ota_project:
              expected_url = f"https://u.expo.dev/{ota_project}"
              if enabled is not True:
                  raise SystemExit(f"Expected EXUpdatesEnabled=True in Expo.plist, got {enabled!r}")
              if actual_url != expected_url:
                  raise SystemExit(f"Unexpected EXUpdatesURL in Expo.plist: {actual_url!r}")
              if actual_runtime != ota_runtime:
                  raise SystemExit(f"Unexpected EXUpdatesRuntimeVersion in Expo.plist: {actual_runtime!r}")
          else:
              if enabled is not False:
                  raise SystemExit(f"Expected EXUpdatesEnabled=False when OTA vars are unset, got {enabled!r}")
          print(f"Longest IPA path: {len(longest)} characters; verified {len(asset_dirs)} asset directories; EXUpdatesEnabled={enabled}")
          ' "$GITHUB_WORKSPACE/ios-artifact/Sydney-unsigned.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/ios-artifact/Sydney-unsigned.ipa" > "$GITHUB_WORKSPACE/ios-artifact/SHA256.txt"

      - name: Upload unsigned IPA for personal signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sydney-ios-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ios-artifact/
          if-no-files-found: error
          retention-days: 7
