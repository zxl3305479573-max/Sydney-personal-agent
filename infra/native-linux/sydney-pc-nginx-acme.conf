user sydney-web-stage sydney-web-stage;
worker_processes 1;
pid /run/sydney-pc-nginx.pid;
error_log /var/log/nginx/sydney-pc-error.log warn;

events {
    worker_connections 128;
}

http {
    access_log off;

    server {
        listen 80 default_server;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/lib/sydney-pc-acme;
        }

        location / {
            return 404;
        }
    }
}
