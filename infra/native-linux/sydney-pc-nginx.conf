user sydney-web-stage sydney-web-stage;
worker_processes 1;
pid /run/sydney-pc-nginx.pid;
error_log /var/log/nginx/sydney-pc-error.log warn;

events {
    worker_connections 1024;
}

http {
    access_log off;
    client_max_body_size 128m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80 default_server;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/lib/sydney-pc-acme;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 443 ssl default_server;
        server_name pc.zxlup.xin;

        ssl_certificate /etc/letsencrypt/live/sydney-pc/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sydney-pc/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        if ($host != pc.zxlup.xin) {
            return 421;
        }

        location / {
            proxy_pass http://unix:/run/sydney-web-stage/web.sock:;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header Host pc.zxlup.xin;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host pc.zxlup.xin;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
    }
}
